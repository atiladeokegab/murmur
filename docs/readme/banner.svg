<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">Murmur</title>
  <desc id="d">Murmur: a phone built for ears.</desc>
  <rect width="1280" height="320" fill="#000"/>
  <rect x="24" y="24" width="1232" height="272" rx="20" fill="#0B0A07" stroke="#2B2820" stroke-width="2"/>
  <!-- the agent's cursor ring, the product's one mark -->
  <circle cx="1040" cy="160" r="76" fill="none" stroke="#FFB000" stroke-width="10"/>
  <circle cx="1040" cy="160" r="104" fill="none" stroke="#FFB000" stroke-width="3" opacity="0.45"/>
  <circle cx="1040" cy="160" r="132" fill="none" stroke="#FFB000" stroke-width="2" opacity="0.2"/>
  <!-- a murmur: a soft voice wave -->
