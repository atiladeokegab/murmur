  <text x="96" y="168" fill="#F4F2EA" font-family="'Atkinson Hyperlegible Next','Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="104" font-weight="700" letter-spacing="-2">Murmur</text>
  <text x="100" y="228" fill="#FFB000" font-family="'Atkinson Hyperlegible Next','Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="34" font-weight="700">A phone built for ears.</text>
