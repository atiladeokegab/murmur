<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Murmur OS: Earcons &amp; Haptics Demo</title>
  <style>
    :root {
      --bg: #121212;
      --card: #1c1c1c;
      --border: #2e2e2e;
      --text: #ffffff;
      --text-muted: #a0a0a0;
      --accent: #f7c325;
      --accent-hover: #ffd748;
      --accent-glow: rgba(247, 195, 37, 0.25);
      --danger: #ff5555;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 2rem 1rem;
      max-width: 680px;
      margin: 0 auto;
      line-height: 1.5;
    }
    header {
      margin-bottom: 2rem;
      border-bottom: 2px solid var(--accent);
      padding-bottom: 1rem;
    }
    h1 {
      font-size: 1.8rem;
      color: var(--accent);
      letter-spacing: -0.02em;
      margin-bottom: 0.25rem;
    }
    p.subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 0.75rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      border-color: var(--accent);
    }
    .card.active {
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }
    .card h2 {
      font-size: 1.2rem;
      text-transform: capitalize;
    }
    .card .desc {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .card .meta {
      font-family: ui-monospace, monospace;
      font-size: 0.8rem;
      color: var(--accent);
    }
    button.play-btn {
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 6px;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: background 0.15s, transform 0.05s;
    }
    button.play-btn:hover {
      background: var(--accent-hover);
    }
    button.play-btn:active {
      transform: scale(0.98);
    }
    .controls {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
      margin-bottom: 2rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1.5rem;
    }
    .control-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    label {
      font-size: 0.9rem;
      font-weight: 500;
    }
    input[type="range"] {
      accent-color: var(--accent);
    }
    .log-box {
      background: #000;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1rem;
      font-family: ui-monospace, monospace;
      font-size: 0.85rem;
      height: 140px;
      overflow-y: auto;
      color: #88ff88;
    }
    .step-badge {
      display: inline-block;
      background: #2a2a2a;
      color: var(--accent);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.75rem;
      margin-left: 0.5rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Murmur OS: Earcons &amp; Haptics</h1>
    <p class="subtitle">Felt-mallet acoustic physical modeling synthesizer (§7 Sound design &bull; feels like magic)</p>
  </header>

  <section class="controls" aria-label="Audio Controls">
    <div class="control-group">
      <label for="vol">Volume:</label>
      <input type="range" id="vol" min="0" max="100" value="100">
      <span id="vol-val" style="font-family: monospace;">100%</span>
    </div>
    <div class="control-group">
      <input type="checkbox" id="mute-toggle">
      <label for="mute-toggle">Mute</label>
    </div>
    <div class="control-group">
      <input type="checkbox" id="quiet-toggle">
      <label for="quiet-toggle">Quiet Mode (no sound / no haptics)</label>
    </div>
    <div class="control-group">
      <button id="reset-step-btn" style="background: #2a2a2a; color: #fff; border: 1px solid var(--border); padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.8rem;">
        Reset Step Ticks
      </button>
    </div>
  </section>

  <main class="grid" id="earcon-grid" aria-label="Earcon Soundboard"></main>

  <section>
    <h3 style="margin-bottom: 0.5rem; font-size: 1rem; color: var(--text-muted);">Event Output Log</h3>
    <div class="log-box" id="log" aria-live="polite">Waiting for first tap... (AudioContext unlocked on first tap)</div>
  </section>

  <script type="module">
    import sound, { EARCON_DEFS, EARCON_NAMES } from './index.js';

    const grid = document.getElementById('earcon-grid');
    const logEl = document.getElementById('log');
    const volInput = document.getElementById('vol');
    const volVal = document.getElementById('vol-val');
    const muteToggle = document.getElementById('mute-toggle');
    const quietToggle = document.getElementById('quiet-toggle');
    const resetStepBtn = document.getElementById('reset-step-btn');

    function log(msg) {
      const line = `[${new Date().toISOString().substring(11, 19)}] ${msg}`;
      logEl.innerHTML = line + '<br>' + logEl.innerHTML;
    }

    volInput.addEventListener('input', (e) => {
      const v = Number(e.target.value) / 100;
      sound.setVolume(v);
      volVal.textContent = `${Math.round(v * 100)}%`;
      log(`Volume set to ${Math.round(v * 100)}%`);
    });

    muteToggle.addEventListener('change', (e) => {
      if (e.target.checked) {
        sound.mute();
        log('Muted');
      } else {
        sound.unmute();
        log('Unmuted');
      }
    });

    quietToggle.addEventListener('change', (e) => {
      sound.setQuiet(e.target.checked);
      log(`Quiet mode: ${e.target.checked ? 'ENABLED' : 'DISABLED'}`);
    });

    resetStepBtn.addEventListener('click', () => {
      sound.resetStepCount();
      updateStepBadge();
      log('Step counter reset to 0');
    });

    function updateStepBadge() {
      const badge = document.getElementById('step-counter-badge');
      if (badge) {
        badge.textContent = `step ${sound.getStepCount()} (+${sound.getStepCount() % 12} st)`;
      }
    }

    for (const name of EARCON_NAMES) {
      const def = EARCON_DEFS[name];
      const card = document.createElement('div');
      card.className = 'card';
      card.id = `card-${name}`;
      const badgeHtml = name === 'step' ? `<span id="step-counter-badge" class="step-badge">step 0 (+0 st)</span>` : '';
      card.innerHTML = `
        <div>
          <h2>${name} ${badgeHtml}</h2>
          <p class="desc">${def.description}</p>
        </div>
        <div>
          <p class="meta">⏱ ${def.durationMs}ms &bull; 📳 [${def.vibratePattern.join(', ')}]ms</p>
          <button class="play-btn" style="margin-top: 0.5rem; width: 100%;" data-name="${name}" data-earcon="${name}">
            <span>▶</span> Play &amp; Buzz
          </button>
        </div>
      `;
      grid.appendChild(card);
    }

    grid.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-name]');
      if (!btn) return;
      const name = btn.dataset.name;
      const played = sound.play(name);
      const buzzed = sound.buzz(name);
      const def = EARCON_DEFS[name];

      updateStepBadge();

      const card = document.getElementById(`card-${name}`);
      if (card) {
        card.classList.add('active');
        setTimeout(() => card.classList.remove('active'), def.durationMs + 50);
      }

      log(`Triggered "${name}" (${def.durationMs}ms) &rarr; Sound: ${played ? 'OK' : 'Muted/Quiet'}, Haptics: ${buzzed ? 'Vibrated' : 'Off/No-op'}`);
    });
  </script>
</body>
</html>
